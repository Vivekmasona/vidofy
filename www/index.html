<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vidofy</title>
<style>
  html, body { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    background: #07070a; color: #fff; font-family: sans-serif; 
    display: flex; align-items: center; justify-content: center; flex-direction: column; 
    overflow: hidden; 
  }
  .loader { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #00f2fe; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="loader"></div>
  <p style="color:#aaa; font-size:14px;">Loading Fullscreen Vidofy...</p>

<script>
// Hide Android Status Bar using Capacitor StatusBar Plugin
document.addEventListener('DOMContentLoaded', async () => {
  try {
    if (window.Capacitor && window.Capacitor.Plugins.StatusBar) {
      await window.Capacitor.Plugins.StatusBar.hide();
    }
  } catch (e) {
    console.log("StatusBar hide error: ", e);
  }
});

// Media Session API for Lock-Screen Notification & Controls
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: "Vidofy Call & Stream",
    artist: "Vidofy Studio",
    album: "WebRTC & Audio",
    artwork: [
      { src: 'https://vidofy.vercel.app/icon.png', sizes: '512x512', type: 'image/png' }
    ]
  });
}

// Background Freeze-Mitigation Heartbeat
setInterval(() => {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = "playing";
  }
}, 2000);
</script>

</body>
</html>
